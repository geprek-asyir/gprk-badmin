<style>
:root{--bg:#fbf4e6;--card:#fff;--tx:#2b1514;--mu:#7d6b61;--ac:#751a17;--acx:#f6e7cb;--ac2:#cd1f30;--gold:#edb66d;--cream:#f6e7cb;--bd:#eadcc3;--bad:#cd1f30;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b0f0e;--card:#2a1816;--tx:#f6e7cb;--mu:#b9a28a;--ac:#cd1f30;--acx:#fff;--ac2:#edb66d;--gold:#edb66d;--cream:#f6e7cb;--bd:#45282a;--bad:#ff7a6b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b0f0e;--card:#2a1816;--tx:#f6e7cb;--mu:#b9a28a;--ac:#cd1f30;--acx:#fff;--ac2:#edb66d;--gold:#edb66d;--cream:#f6e7cb;--bd:#45282a;--bad:#ff7a6b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:16px}
.top{background:#fff;border-bottom:5px solid var(--gold);box-shadow:0 3px 0 #751a17}.top .in{max-width:640px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:center}.top img{height:52px;width:auto;display:block}.top h1 img.motto{height:40px;max-width:100%}.top h1{margin:0;border-left:3px solid #cd1f30;padding-left:12px;display:flex;align-items:center;min-width:0}
h2{font-size:13px;margin:18px 0 8px;color:var(--tx);font-weight:800;text-transform:uppercase;letter-spacing:.06em;border-left:4px solid var(--gold);padding-left:8px}
nav{display:flex;gap:0;margin-bottom:14px;border-bottom:1px solid var(--bd)}
nav a{flex:1;text-align:center;padding:11px 4px;color:var(--mu);text-decoration:none;font-weight:800;text-transform:uppercase;letter-spacing:.06em;font-size:13px;border-bottom:3px solid transparent;margin-bottom:-1px}
nav a.on{color:var(--ac);border-bottom-color:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) nav a.on{color:var(--cream)}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:4px;padding:12px;margin-bottom:8px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.sc{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--bd);white-space:nowrap}
th{color:var(--mu);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
td.n{text-align:left;font-weight:600}
tr:nth-child(2) td{color:var(--ac2);font-weight:800}tr:nth-child(2) td.n{border-left:3px solid var(--gold)}
.m{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.m .t{flex:1;min-width:140px}
.m b.w{color:var(--ac2)}
input,select,textarea,button{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:7px 9px}
input.s{width:52px;text-align:center}
textarea{width:100%;min-height:200px}
button{cursor:pointer;background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:800;text-transform:uppercase;letter-spacing:.04em;font-size:13px;border-radius:4px}
button.g{background:transparent;color:var(--mu);border-color:var(--bd)}
button.d{background:transparent;color:var(--bad);border-color:var(--bd)}
.mu{color:var(--mu);font-size:13px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--cream);color:#751a17}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border:1px solid var(--bd);border-radius:99px;background:var(--bg);cursor:pointer}.chip input{margin:0}
nav a{font-size:12px}
.foot{margin-top:24px;text-align:center}.foot input{flex:1;min-width:140px}

(function(){

function tab(){var h=location.hash.slice(1);return TABS.some(function(x){return x[0]===h})?h:'klasemen'}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function W(){return S.weeks.filter(function(w){return w.id===cw})[0]}
function pn(p){return p.join(' / ')}
function played(m){return typeof m.sa==='number'&&typeof m.sb==='number'}
function present(w){var all=S.players.map(function(p){return p.n});return w.present?w.present.filter(function(n){return all.indexOf(n)>-1}):all}
function paired(w){var r=[];w.pairs.forEach(function(p){r=r.concat(p)});return r}
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function lvl(n){var p=S.players.filter(function(x){return x.n===n})[0];return p?p.l:2}
function rank(t){return Object.keys(t).map(function(k){return t[k]}).sort(function(x,y){return (y.w-x.w)||((y.pf-y.pa)-(x.pf-x.pa))||(y.pf-x.pf)||x.n.localeCompare(y.n)})}
function add(t,k,sf,sa){var o=t[k]=t[k]||{n:k,p:0,w:0,l:0,pf:0,pa:0};o.p++;o.pf+=sf;o.pa+=sa;if(sf>sa)o.w++;else if(sa>sf)o.l++}
function weekStand(w){var t={};w.pairs.forEach(function(p){t[pn(p)]={n:pn(p),p:0,w:0,l:0,pf:0,pa:0}});
  w.matches.forEach(function(m){if(!played(m))return;add(t,pn(w.pairs[m.a]),m.sa,m.sb);add(t,pn(w.pairs[m.b]),m.sb,m.sa)});return rank(t)}
function allStand(){var t={};S.players.forEach(function(p){t[p.n]={n:p.n,p:0,w:0,l:0,pf:0,pa:0}});
  S.weeks.forEach(function(w){w.matches.forEach(function(m){if(!played(m))return;
    w.pairs[m.a].forEach(function(n){add(t,n,m.sa,m.sb)});w.pairs[m.b].forEach(function(n){add(t,n,m.sb,m.sa)})})});
  return rank(t).filter(function(x){return x.p>0||S.players.length<=40})}

function tbl(r,t){

}

}

    h+='<h2>Siapa yang hadir pekan ini?</h2><div class="card chips">'+(S.players.length?S.players.map(function(p,i){return '<label class="chip"><input type="checkbox" data-a="tg" data-i="'+i+'"'+(pr.indexOf(p.n)>-1?' checked':'')+'> '+esc(p.n)+'</label>'}).join(''):'<span class="mu">Isi daftar di tab Pemain dulu.</span>')+'<div class="mu" style="margin-top:6px">Hadir: '+pr.length+' orang</div></div>'+
      '<h2>Buat pasangan</h2><div class="card"><div class="row"><button data-a="pa">'+(armed?'Yakin? Jadwal akan dihapus':'Acak')+'</button><button data-a="ps">'+(armed?'Yakin? Jadwal akan dihapus':'Seimbang')+'</button></div>'+
      '<div class="mu" style="margin-top:6px">Acak: diundi bebas. Seimbang: pemain level tinggi dipasangkan dengan level rendah.</div>';
    var o=left.map(function(n){return '<option>'+esc(n)+'</option>'}).join('');
    h+='<h2>Atau pilih manual</h2><div class="row"><select id="p1">'+o+'</select><span>+</span><select id="p2">'+o+'</select><button data-a="pm">Tambah</button></div></div>';
  }
  h+='<h2>Pasangan '+esc(w.label)+'</h2>';
  if(!w.pairs.length)h+='<div class="card mu">Belum ada pasangan.</div>';
  w.pairs.forEach(function(p,i){h+='<div class="card m"><div class="t"><b>'+esc(pn(p))+'</b></div>'+(admin?'<button class="d" data-a="pd" data-i="'+i+'" aria-label="Hapus">✕</button>':'')+'</div>'});
  if(w.pairs.length&&left.length)h+='<p class="mu">Belum berpasangan: '+left.map(esc).join(', ')+'</p>';
  return h;
}
function vPemain(){
  if(!admin)return '<div class="card"><b>'+S.players.length+' pemain</b><div class="mu" style="margin-top:6px">'+(S.players.map(function(p){return esc(p.n)}).join(', ')||'Belum ada')+'</div></div>';
  return '<div class="card"><div class="mu" style="margin-bottom:6px">Satu pemain per baris, ditulis "Nama, level". Level 1 = pemula, 2 = menengah, 3 = mahir. Tanpa level dianggap 2. Level hanya dipakai untuk pasangan Seimbang.</div>'+
    '<textarea id="tl">'+esc(S.players.map(function(p){return p.n+', '+p.l}).join('\n'))+'</textarea><div class="row" style="margin-top:8px"><button data-a="sp">Simpan daftar</button></div></div>';
}
var root=document.getElementById('root');
function render(){var t=tab();root.innerHTML=head()+(t==='jadwal'?vJadwal():t==='pasangan'?vPasangan():t==='pemain'?vPemain():vKlasemen())+foot()}
function foot(){
  var h='<div class="foot">';
  if(configured===false)h+='<p class="mu">Firebase belum diatur, jadi ini hanya tampilan contoh.</p>';
  if(admin)h+='<button class="g" data-l="lo">Keluar (admin)</button>';
  else if(showLogin)h+='<div class="card"><div class="row"><input id="em" type="email" placeholder="Email admin" autocomplete="username"><input id="pw" type="password" placeholder="Kata sandi" autocomplete="current-password"><button data-l="li">Masuk</button></div>'+(msg?'<p class="mu" style="color:var(--bad)">'+esc(msg)+'</p>':'')+'</div>';
  else h+='<button class="g" data-l="lg">Admin</button>';
  return h+'</div>';
}
function guard(w){if(w.matches.length&&!armed){armed=true;render();return false}armed=false;return true}
function setPairs(w,list){w.pairs=list;w.matches=[];save()}
var A={
 nw:function(){var id=S.weeks.reduce(function(m,w){return Math.max(m,w.id)},0)+1;S.weeks.push({id:id,label:'Pekan '+id,pairs:[],matches:[],present:null});cw=id;save()},
 sp:function(){var seen={};S.players=document.getElementById('tl').value.split('\n').map(function(s){s=s.trim();var m=s.match(/^(.*?)[,;]\s*([1-3])$/);return m?{n:m[1].trim(),l:+m[2]}:{n:s,l:2}}).filter(function(p){if(!p.n||seen[p.n])return false;seen[p.n]=1;return true});save()},
 tg:function(el){var w=W(),n=S.players[+el.dataset.i].n,p=present(w).slice(),k=p.indexOf(n);if(k>-1)p.splice(k,1);else p.push(n);w.present=p;render()},
 pa:function(){var w=W();if(!guard(w))return;var l=shuf(present(w)),r=[];for(var i=0;i+1<l.length;i+=2)r.push([l[i],l[i+1]]);setPairs(w,r)},
 ps:function(){var w=W();if(!guard(w))return;var l=shuf(present(w)).sort(function(a,b){return lvl(b)-lvl(a)}),r=[],n=l.length;for(var i=0;i<Math.floor(n/2);i++)r.push([l[i],l[n-1-i]]);setPairs(w,r)},
 pm:function(){var w=W(),a=document.getElementById('p1').value,b=document.getElementById('p2').value;if(!a||!b||a===b){alert('Pilih dua pemain yang berbeda.');return}if(!guard(w))return;w.pairs.push([a,b]);w.matches=[];save()},
 pd:function(el){var w=W();if(!guard(w))return;w.pairs.splice(+el.dataset.i,1);w.matches=[];save()},
 gen:function(){var w=W();if(w.pairs.length<2){alert('Buat minimal 2 pasangan dulu.');return}if(w.matches.length&&!armed){armed=true;render();return}armed=false;
  var ts=w.pairs.map(function(p,i){return i}),ms=[];if(ts.length%2)ts.push(null);var n=ts.length;
  for(var r=0;r<n-1;r++){for(var i=0;i<n/2;i++){var a=ts[i],b=ts[n-1-i];if(a!==null&&b!==null)ms.push({a:a,b:b,r:r+1,sa:null,sb:null})}ts.splice(1,0,ts.pop())}
  w.matches=ms;save()},
 am:function(){var w=W(),a=document.getElementById('ma').value,b=document.getElementById('mb').value;if(a===''||b===''||a===b){alert('Pilih dua lawan yang berbeda.');return}
  w.matches.push({a:+a,b:+b,r:parseInt(document.getElementById('mr').value,10)||1,sa:null,sb:null});save()},
 sm:function(el){var w=W(),i=el.dataset.i,a=document.querySelector('[data-sa="'+i+'"]').value,b=document.querySelector('[data-sb="'+i+'"]').value;
  if(a===''||b===''){w.matches[i].sa=null;w.matches[i].sb=null}else{w.matches[i].sa=parseInt(a,10);w.matches[i].sb=parseInt(b,10)}save()},
 dm:function(el){W().matches.splice(+el.dataset.i,1);save()}
};
root.addEventListener('click',function(e){var l=e.target.closest('[data-l]');if(l){var k=l.dataset.l;if(k==='lg'){showLogin=true;render()}else if(k==='lo'){signOut(auth)}else if(k==='li'){signInWithEmailAndPassword(auth,document.getElementById('em').value.trim(),document.getElementById('pw').value).then(function(){showLogin=false;msg=''}).catch(function(){msg='Email atau kata sandi salah.';render()})}return}var t=e.target.closest('[data-a]');if(t&&admin&&A[t.dataset.a])A[t.dataset.a](t)});
root.addEventListener('change',function(e){if(e.target.id==='ws'){cw=+e.target.value;armed=false;render()}});
window.addEventListener('hashchange',function(){armed=false;render()});
render();
var showLogin=false,msg='',first=true,ref=null,auth=null;
var configured=firebaseConfig.apiKey.indexOf('ISI')!==0;
if(configured){
  var fapp=initializeApp(firebaseConfig),fdb=getFirestore(fapp);auth=getAuth(fapp);ref=doc(fdb,'app','state');
  onSnapshot(ref,function(sn){
    if(sn.exists()){try{S=JSON.parse(sn.data().json)}catch(e){}}
    S.players=S.players||[];S.weeks=S.weeks||[];
    if(first||!W()){cw=S.cur||(S.weeks.length?S.weeks[S.weeks.length-1].id:0);first=false}
    render();
  },function(){msg='Gagal memuat data.';render()});
  onAuthStateChanged(auth,function(u){
    admin=!!u;
    if(u)getDoc(ref).then(function(sn){if(!sn.exists())return setDoc(ref,{json:JSON.stringify(S)})}).catch(function(){});
    render();
  });
}else{configured=false;render()}
})();
</script>
